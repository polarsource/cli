name: Publish Homebrew tap

on:
  workflow_call:
    inputs:
      tag:
        description: Stable CLI release tag
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable release to publish, e.g. v2.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate configuration and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test -n "$TAP_TOKEN" || { echo "Configure HOMEBREW_TAP_TOKEN; see docs/homebrew.md"; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Only stable version tags can be published"; exit 1; }
          gh release view "$RELEASE_TAG" --repo polarsource/cli --json isDraft,isPrerelease \
            | jq -e '.isDraft == false and .isPrerelease == false'

      - name: Download release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release download "$RELEASE_TAG" --repo polarsource/cli --pattern checksums.txt --dir release

      - name: Generate formula
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bun scripts/homebrew.ts "$RELEASE_TAG" release/checksums.txt generated/Formula/polar.rb

      - name: Check out tap
        uses: actions/checkout@v4
        with:
          repository: polarsource/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Copy formula
        run: |
          mkdir -p tap/Formula
          cp generated/Formula/polar.rb tap/Formula/polar.rb

      - name: Open tap update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          add-paths: Formula/polar.rb
          branch: polar-${{ inputs.tag }}
          delete-branch: true
          commit-message: "polar: update to ${{ inputs.tag }}"
          title: "polar: update to ${{ inputs.tag }}"
          body: |
            Publish Polar CLI ${{ inputs.tag }} from https://github.com/polarsource/cli/releases/tag/${{ inputs.tag }}.

            Generated from the stable release's checksums.txt. Supports macOS arm64/x64 and Linux x64.
